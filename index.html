<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFL Okul Ligi - Puan Durumu ve Fikstür</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #111;
      color: #eaeaea;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
      color: #f1f1f1;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h2 {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      color: #ffcc00;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .table-wrapper {
      width: 100%;
      max-width: 850px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      table-layout: auto;
      border-collapse: collapse;
      width: 100%;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      margin: 0 auto;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #333;
      text-align: center;
      white-space: nowrap;
      box-sizing: border-box;
    }

    /* Tablo Üst Başlıkları BEYAZ Yapıldı */
    th {
      background: #222;
      color: #ffffff;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }

    td {
      color: #ddd;
      font-size: 14px;
    }

    /* Puan Durumu Özel Vurguları */
    .standings-table td:nth-child(2) {
      font-weight: bold;
      text-align: left;
      padding-left: 15px;
    }
    
    /* Puan Durumu P Sütunu (10. sütun) SARI Yapıldı */
    .standings-table th:nth-child(10),
    .standings-table td:nth-child(10) {
      color: #ffcc00;
      font-weight: bold;
    }

    /* Fikstür Özel Vurguları */
    .fixture-table td:nth-child(2),
    .fixture-table td:nth-child(3) {
      font-weight: bold;
    }
    
    /* Fikstür SKOR Sütunu (4. sütun) SARI Yapıldı */
    .fixture-table th:nth-child(4),
    .fixture-table td:nth-child(4) {
      color: #ffcc00;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background: #181818;
    }

    tr:hover {
      background: #2a2a2a;
      transition: 0.2s ease;
    }

    .loading {
      font-style: italic;
      color: #888;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      h1 { font-size: 20px; }
      h2 { font-size: 16px; }
      th, td { padding: 8px 5px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <h1>IFL OKUL LİGİ 1. DEVRE</h1>

  <div class="container">
    
    <!-- PUAN DURUMU -->
    <h2>PUAN DURUMU</h2>
    <div class="table-wrapper">
      <table class="standings-table">
        <thead>
          <tr>
            <th>Sıra</th>
            <th>Takım</th>
            <th>OM</th>
            <th>G</th>
            <th>B</th>
            <th>M</th>
            <th>AG</th>
            <th>YG</th>
            <th>A</th>
            <th>P</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <tr><td colspan="10" class="loading">Puan durumu yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- FİKSTÜR -->
    <h2>FİKSTÜR VE MAÇ SONUÇLARI</h2>
    <div class="table-wrapper">
      <table class="fixture-table">
        <thead>
          <tr>
            <th>TARİH</th>
            <th>EV SAHİBİ</th>
            <th>DEPLASMAN</th>
            <th>SKOR</th>
          </tr>
        </thead>
        <tbody id="fixture-body">
          <tr><td colspan="4" class="loading">Fikstür yükleniyor...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const sheetId = "1apkYHb2JWHu-nR7ifZB6vJ5Me6pZTvVin_5FPlMzQg4";

    function fetchSheetData(range, callbackName) {
      const script = document.createElement('script');
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&range=${range}`;
      document.body.appendChild(script);
    }

    window.handleStandings = function(data) {
      const rows = data.table.rows;
      const tbody = document.getElementById("standings-body");
      tbody.innerHTML = "";

      rows.forEach(r => {
        const tr = document.createElement("tr");
        for (let i = 0; i < 10; i++) {
          const td = document.createElement("td");
          const val = r.c && r.c[i] ? (r.c[i].v !== null ? r.c[i].v : "") : "";
          td.textContent = val;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
    };

    window.handleFixture = function(data) {
      const rows = data.table.rows;
      const tbody = document.getElementById("fixture-body");
      tbody.innerHTML = "";

      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r.c || !r.c[0] || !r.c[0].v) continue;

        const tr = document.createElement("tr");
        for (let j = 0; j < 4; j++) {
          const td = document.createElement("td");
          let val = r.c && r.c[j] ? (r.c[j].f ? r.c[j].f : (r.c[j].v !== null ? r.c[j].v : "")) : "";
          td.textContent = val;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    };

    function loadAllData() {
      fetchSheetData("A2:J8", "handleStandings");
      fetchSheetData("A11:D26", "handleFixture");
    }

    loadAllData();
    setInterval(loadAllData, 60000);
  </script>

</body>
</html>
