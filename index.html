<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />

    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 27, 34, 0.85);

      --gold: #f39c12;
      --gold-glow: rgba(243, 156, 18, 0.3);
      --text-main: #ffffff;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image: radial-gradient(circle at 50% 0%, #1a233a 0%, var(--bg-color) 70%);
      text-align: center;
    }

      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid var(--gold);
      padding-bottom: 10px;
      color: var(--text-main);
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);

      letter-spacing: 1px;
      margin-top: 10px;
      margin-bottom: 15px;
    }

      display: flex;
      flex-direction: column;
      align-items: center;

      width: 100%;
      max-width: 1200px;
    }
