<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFL Okul Ligi - Puan Durumu ve Fikstür</title>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #0b0b0b;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.14) 0%, #0b0b0b 65%);
      color: #eaeaea;
      text-align: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }

    /* Ana Başlık */
    h1 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-block;
      padding-bottom: 10px;
      border-bottom: 2px solid #ff6a00;
    }

    /* Alt Başlıklar */
    h2 {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .table-wrapper {
      width: 100%;
      max-width: 850px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #fixtures-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .class-fixture-block {
      width: 100%;
      max-width: 850px;
    }

    .class-fixture-title {
      font-size: 15px;
      font-weight: bold;
      color: #ff6a00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 8px 4px;
      text-align: left;
    }

    table {
      table-layout: auto;
      border-collapse: collapse;
      width: 100%;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      margin: 0 auto;
    }

    /* Fikstür tablolarında veri girilince kayma olmaması için sabit sütun düzeni */
    .fixture-table {
      table-layout: fixed;
      width: 100%;
    }

    .fixture-table th:nth-child(1),
    .fixture-table td:nth-child(1) {
      width: 26%;
    }

    .fixture-table th:nth-child(2),
    .fixture-table td:nth-child(2) {
      width: 24%;
    }

    .fixture-table th:nth-child(3),
    .fixture-table td:nth-child(3) {
      width: 20%;
    }

    .fixture-table th:nth-child(4),
    .fixture-table td:nth-child(4) {
      width: 30%;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #333;
      text-align: center;
      white-space: nowrap;
      box-sizing: border-box;
    }

    /* Tablo Üst Başlıkları */
    th {
      background: #222;
      color: #ffffff;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }

    td {
      color: #ddd;
      font-size: 14px;
    }

    /* Puan Durumu Özel Vurguları */
    .standings-table td:nth-child(2) {
      font-weight: bold;
      text-align: left;
      padding-left: 15px;
    }

    /* Puan Durumu P Sütunu */
    .standings-table th:nth-child(10),
    .standings-table td:nth-child(10) {
      color: #ff6a00;
      font-weight: bold;
    }

    /* Fikstür Özel Vurguları: 1. Sütun Tarih, 2. Sütun Rakip, 3. Sütun Skor, 4. Sütun Sonuç */
    .fixture-table td:nth-child(2) {
      font-weight: bold;
    }

    /* Fikstür Skor Sütunu */
    .fixture-table th:nth-child(3),
    .fixture-table td:nth-child(3) {
      color: #ff6a00;
      font-weight: bold;
    }

    /* Fikstür Sonuç Başlığı (Beyaz) ve Durum Renkleri */
    .fixture-table th:nth-child(4) {
      color: #ffffff;
    }

    .fixture-table td:nth-child(4) {
      font-weight: bold;
    }

    .sonuc-galibiyet {
      color: #22c55e !important;
    }

    .sonuc-beraberlik {
      color: #eab308 !important;
    }

    .sonuc-maglubiyet {
      color: #ef4444 !important;
    }

    tr:nth-child(even) {
      background: #181818;
    }

    tr:hover {
      background: #2a2a2a;
      transition: 0.2s ease;
    }

    .loading {
      font-style: italic;
      color: #888;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 16px;
      }

      th, td {
        padding: 8px 5px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <h1>IFL FUTBOL LİGİ</h1>

  <div class="container">

    <!-- PUAN DURUMU -->
    <h2>PUAN DURUMU</h2>

    <div class="table-wrapper">
      <table class="standings-table">
        <thead>
          <tr>
            <th>Sıra</th>
            <th>Takım</th>
            <th>OM</th>
            <th>G</th>
            <th>B</th>
            <th>M</th>
            <th>AG</th>
            <th>YG</th>
            <th>A</th>
            <th>P</th>
          </tr>
        </thead>

        <tbody id="standings-body">
          <tr>
            <td colspan="10" class="loading">Puan durumu yükleniyor...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- FİKSTÜR -->
    <h2>FİKSTÜR VE MAÇ SONUÇLARI</h2>

    <div id="fixtures-container">
      <div class="table-wrapper">
        <table class="fixture-table">
          <tbody>
            <tr>
              <td colspan="4" class="loading">Fikstür yükleniyor...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const sheetId = "1apkYHb2JWHu-nR7ifZB6vJ5Me6pZTvVin_5FPlMzQg4";

    function fetchSheetData(range, callbackName, noHeaders = false) {
      const oldScript = document.getElementById(`script-${callbackName}`);
      if (oldScript) oldScript.remove();

      const headerParam = noHeaders ? "&headers=0" : "";
      const script = document.createElement('script');
      script.id = `script-${callbackName}`;
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&range=${range}${headerParam}&cb=${Date.now()}`;
      document.body.appendChild(script);
    }

    window.handleStandings = function(data) {
      if (!data || !data.table || !data.table.rows) return;
      const rows = data.table.rows;
      const tbody = document.getElementById("standings-body");
      tbody.innerHTML = "";

      rows.forEach(r => {
        if (!r.c) return;
        const tr = document.createElement("tr");

        for (let i = 0; i < 10; i++) {
          const td = document.createElement("td");
          const val = r.c[i] && r.c[i].v !== null && r.c[i].v !== undefined
            ? (r.c[i].f ? r.c[i].f : r.c[i].v)
            : "";

          td.textContent = val;
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      });
    };

    const classBlocks = [
      { id: "9a",  title: "9/A FİKSTÜR",  range: "A12:D16" },
      { id: "9b",  title: "9/B FİKSTÜR",  range: "A20:D24" },
      { id: "10a", title: "10/A FİKSTÜR", range: "A28:D32" },
      { id: "10b", title: "10/B FİKSTÜR", range: "A36:D40" },
      { id: "11a", title: "11/A FİKSTÜR", range: "A44:D48" },
      { id: "11b", title: "11/B FİKSTÜR", range: "A52:D56" }
    ];

    function initFixtureContainers() {
      const container = document.getElementById("fixtures-container");
      if (container.dataset.initialized === "true") return;

      container.innerHTML = "";
      classBlocks.forEach(cls => {
        const block = document.createElement("div");
        block.className = "class-fixture-block";

        const title = document.createElement("div");
        title.className
