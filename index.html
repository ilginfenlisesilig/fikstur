<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFL Okul Ligi - Puan Durumu ve Fikstür</title>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #0b0b0b;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.14) 0%, #0b0b0b 65%);
      color: #eaeaea;
      text-align: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }

    /* Ana Başlık */
    h1 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-block;
      padding-bottom: 10px;
      border-bottom: 2px solid #ff6a00;
      text-shadow: 0 0 20px rgba(255, 106, 0, 0.25);
    }

    /* Alt Başlıklar */
    h2 {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .table-wrapper {
      width: 100%;
      max-width: 850px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      table-layout: auto;
      border-collapse: collapse;
      width: 100%;
      background: #181818;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      margin: 0 auto;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #2e2e2e;
      text-align: center;
      white-space: nowrap;
      box-sizing: border-box;
    }

    /* Tablo Üst Başlıkları */
    th {
      background: #202020;
      color: #ffffff;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }

    td {
      color: #ddd;
      font-size: 14px;
    }

    /* Puan Durumu Özel Vurguları */
    .standings-table td:nth-child(2) {
      font-weight: bold;
      text-align: left;
      padding-left: 15px;
    }

    /* Puan Durumu P Sütunu */
    .standings-table th:nth-child(10),
    .standings-table td:nth-child(10) {
      color: #ff8529;
      font-weight: bold;
    }

    /* Fikstür Özel Vurguları */
    .fixture-table td:nth-child(2),
    .fixture-table td:nth-child(3) {
      font-weight: bold;
    }

    /* Fikstür Skor Sütunu */
    .fixture-table th:nth-child(4),
    .fixture-table td:nth-child(4) {
      color: #ff8529;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background: #141414;
    }

    tr:hover {
      background: rgba(255, 106, 0, 0.1);
      transition: 0.2s ease;
    }

    .loading {
      font-style: italic;
      color: #888;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 16px;
      }

      th, td {
        padding: 8px 5px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <h1>IFL OKUL LİGİ</h1>

  <div class="container">

    <!-- PUAN DURUMU -->
    <h2>PUAN DURUMU</h2>

    <div class="table-wrapper">
      <table class="standings-table">
        <thead>
          <tr>
            <th>Sıra</th>
            <th>Takım</th>
            <th>OM</th>
            <th>G</th>
            <th>B</th>
            <th>M</th>
            <th>AG</th>
            <th>YG</th>
            <th>A</th>
            <th>P</th>
          </tr>
        </thead>

        <tbody id="standings-body">
          <tr>
            <td colspan="10" class="loading">Puan durumu yükleniyor...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- FİKSTÜR -->
    <h2>FİKSTÜR VE MAÇ SONUÇLARI</h2>

    <div class="table-wrapper">
      <table class="fixture-table">
        <thead>
          <tr>
