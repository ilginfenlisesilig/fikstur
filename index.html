<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFL Okul Ligi - Puan Durumu ve Fikstür</title>

  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #0b0b0b;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 106, 0, 0.14) 0%, #0b0b0b 65%);
      color: #eaeaea;
      text-align: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }

    /* Ana Başlık */
    h1 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-block;
      padding-bottom: 10px;
      border-bottom: 2px solid #ff6a00;
    }

    /* Alt Başlıklar */
    h2 {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .table-wrapper {
      width: 100%;
      max-width: 850px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #fixtures-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .class-fixture-block {
      width: 100%;
      max-width: 850px;
    }

    .class-fixture-title {
      font-size: 15px;
      font-weight: bold;
      color: #ff6a00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 8px 4px;
      text-align: left;
    }

    table {
      table-layout: auto;
      border-collapse: collapse;
      width: 100%;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      margin: 0 auto;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #333;
      text-align: center;
      white-space: nowrap;
      box-sizing: border-box;
    }

    /* Tablo Üst Başlıkları */
    th {
      background: #222;
      color: #ffffff;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 1px;
    }

    td {
      color: #ddd;
      font-size: 14px;
    }

    /* Puan Durumu Özel Vurguları */
    .standings-table td:nth-child(2) {
      font-weight: bold;
      text-align: left;
      padding-left: 15px;
    }

    /* Puan Durumu P Sütunu */
    .standings-table th:nth-child(10),
    .standings-table td:nth-child(10) {
      color: #ff6a00;
      font-weight: bold;
    }

    /* Fikstür Özel Vurguları */
    .fixture-table td:nth-child(1) {
      font-weight: bold;
    }

    /* Fikstür Skor Sütunu */
    .fixture-table th:nth-child(3),
    .fixture-table td:nth-child(3) {
      color: #ff6a00;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background: #181818;
    }

    tr:hover {
      background: #2a2a2a;
      transition: 0.2s ease;
    }

    .loading {
      font-style: italic;
      color: #888;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 26px;
      }

      h2 {
        font-size: 16px;
      }

      th, td {
        padding: 8px 5px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <h1>IFL FUTBOL LİGİ</h1>

  <div class="container">

    <!-- PUAN DURUMU -->
    <h2>PUAN DURUMU</h2>

    <div class="table-wrapper">
      <table class="standings-table">
        <thead>
          <tr>
            <th>Sıra</th>
            <th>Takım</th>
            <th>OM</th>
            <th>G</th>
            <th>B</th>
            <th>M</th>
            <th>AG</th>
            <th>YG</th>
            <th>A</th>
            <th>P</th>
          </tr>
        </thead>

        <tbody id="standings-body">
          <tr>
            <td colspan="10" class="loading">Puan durumu yükleniyor...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- FİKSTÜR -->
    <h2>FİKSTÜR VE MAÇ SONUÇLARI</h2>

    <div id="fixtures-container">
      <div class="table-wrapper">
        <table class="fixture-table">
          <tbody>
            <tr>
              <td colspan="3" class="loading">Fikstür yükleniyor...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const sheetId = "1apkYHb2JWHu-nR7ifZB6vJ5Me6pZTvVin_5FPlMzQg4";

    function fetchSheetData(range, callbackName) {
      const oldScript = document.getElementById(`script-${callbackName}`);
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = `script-${callbackName}`;
      script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}&range=${range}`;
      document.body.appendChild(script);
    }

    window.handleStandings = function(data) {
      const rows = data.table.rows;
      const tbody = document.getElementById("standings-body");
      tbody.innerHTML = "";

      rows.forEach(r => {
        const tr = document.createElement("tr");

        for (let i = 0; i < 10; i++) {
          const td = document.createElement("td");
          const val = r.c && r.c[i]
            ? (r.c[i].v !== null ? r.c[i].v : "")
            : "";

          td.textContent = val;
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      });
    };

    window.handleFixture = function(data) {
      const rows = data.table.rows;
      const container = document.getElementById("fixtures-container");
      container.innerHTML = "";

      let currentBlockTitle = null;
      let currentTbody = null;

      rows.forEach(r => {
        if (!r.c) return;

        const getCell = (idx) => {
          if (!r.c[idx]) return "";
          if (r.c[idx].f !== undefined && r.c[idx].f !== null) return String(r.c[idx].f).trim();
          if (r.c[idx].v !== undefined && r.c[idx].v !== null) return String(r.c[idx].v).trim();
          return "";
        };

        const colA = getCell(0);
        const colB = getCell(1);
        const colC = getCell(2);

        if (!colA && !colB && !colC) return;

        // Sınıf başlığı satırı (ör: "9/A FİKSTÜR")
        if (colA.toUpperCase().includes("FİKSTÜR") && !colB) {
          currentBlockTitle = colA;
          currentTbody = null;
          return;
        }

        // Sütun başlığı satırı ("RAKİP | TARİH | SKOR")
        if (colA.toUpperCase() === "RAKİP" && colB.toUpperCase() === "TARİH") {
          const block = document.createElement("div");
          block.className = "class-fixture-block";

          if (currentBlockTitle) {
            const title = document.createElement("div");
            title.className = "class-fixture-title";
            title.textContent = currentBlockTitle;
            block.appendChild(title);
          }

          const wrapper = document.createElement("div");
          wrapper.className = "table-wrapper";

          const table = document.createElement("table");
          table.className = "fixture-table";

          const thead = document.createElement("thead");
          thead.innerHTML = `
            <tr>
              <th>${colA}</th>
              <th>${colB}</th>
              <th>${colC || "SKOR"}</th>
            </tr>
          `;
          table.appendChild(thead);

          currentTbody = document.createElement("tbody");
          table.appendChild(currentTbody);

          wrapper.appendChild(table);
          block.appendChild(wrapper);
          container.appendChild(block);
          return;
        }

        // Maç satırı: [RAKİP, TARİH, SKOR]
        if (currentTbody && colA && colB) {
          const tr = document.createElement("tr");
          [colA, colB, colC].forEach(val => {
            const td = document.createElement("td");
            td.textContent = val;
            tr.appendChild(td);
          });
          currentTbody.appendChild(tr);
        }
      });
    };

    function loadAllData() {
      fetchSheetData("A2:J8", "handleStandings");
      fetchSheetData("A10:C56", "handleFixture");
    }

    loadAllData();
    setInterval(loadAllData, 60000);
  </script>

</body>
</html>
